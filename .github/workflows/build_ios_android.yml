name: Build RealTracks (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD DO ANDROID (.apk)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Native Platform
        run: flutter create . --project-name realtracks --org com.realtracks.app --platforms=android

      - name: Configure Android SDK 36 for Plugins
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle || true
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ==========================================
  # JOB 2: BUILD DO IOS (macOS Runner)
  # ==========================================
  build-ios:
    name: Build iOS (sem precisar de Mac local)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Platform
        run: flutter create . --project-name realtracks --org com.realtracks.app --platforms=ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Compress iOS App Bundle
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r RealTracks-iOS.ipa Payload

      - name: Upload iOS Payload
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-iOS-Build
          path: build/ios/iphoneos/RealTracks-iOS.ipa
          if-no-files-found: warn
