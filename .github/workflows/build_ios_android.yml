name: Build RealTracks (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD DO ANDROID (.apk)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Native Platform
        run: flutter create . --project-name realtracks --org com.realtracks.app --platforms=android

      - name: Configure Android SDK 36 & Debug Signing for Release
        run: |
          # 1. Ajusta compileSdk para 36 em arquivos Groovy ou Kotlin
          find android -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' {} + || true

          # 2. Configura assinatura debug para permitir gerar release APK instalável
          if [ -f "android/app/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          fi

          # 3. Propriedades do Gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          # Tenta o build do release assinado
          flutter build apk --release --no-tree-shake-icons || true

          # Cria diretório para coletar todos os APKs gerados
          mkdir -p final-apk
          find build android -name "*.apk" -exec cp -v {} final-apk/ \; || true

          # Se nenhum APK foi encontrado, executa build debug garantido
          if [ $(ls final-apk/*.apk 2>/dev/null | wc -l) -eq 0 ]; then
            echo "Gerando APK Debug..."
            flutter build apk --debug --no-tree-shake-icons || (cd android && ./gradlew assembleDebug)
            find build android -name "*.apk" -exec cp -v {} final-apk/ \; || true
          fi

          echo "APKs gerados com sucesso:"
          ls -la final-apk/
          test $(ls final-apk/*.apk 2>/dev/null | wc -l) -gt 0

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-Android-APK
          path: final-apk/*.apk
          if-no-files-found: error

  # ==========================================
  # JOB 2: BUILD DO IOS (macOS Runner)
  # ==========================================
  build-ios:
    name: Build iOS (sem precisar de Mac local)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Platform
        run: flutter create . --project-name realtracks --org com.realtracks.app --platforms=ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Compress iOS App Bundle
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r RealTracks-iOS.ipa Payload

      - name: Upload iOS Payload
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-iOS-Build
          path: build/ios/iphoneos/RealTracks-iOS.ipa
          if-no-files-found: warn
