name: Build RealTracks (Windows, macOS, Android & Web PWA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD DO ANDROID (.apk)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Diagnostics
        run: flutter analyze || true

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation || {
            echo "=== BUILD FAILED, CHECKING GRADLE LOGS ==="
            find build -name "*.log" -exec cat {} + 2>/dev/null || true
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ==========================================
  # JOB 2: BUILD DO WINDOWS (.exe & INSTALADOR)
  # ==========================================
  build-windows:
    name: Build Windows Desktop & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Generate Runner
        run: |
          flutter config --enable-windows-desktop
          flutter create --project-name realtracks --org com.realtracks.app --platforms=windows .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop App
        run: flutter build windows --release --no-tree-shake-icons

      - name: Bundle Visual C++ Runtime & Dependencies
        shell: pwsh
        run: |
          # 1. Copia as DLLs do Visual C++ CRT da instalação do Visual Studio para o Release
          $vcDirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending
          if ($vcDirs) {
            $latestVc = $vcDirs[0].FullName
            Write-Host "Copiando DLLs do runtime de: $latestVc"
            Copy-Item "$latestVc\x64\Microsoft.VC143.CRT\*.dll" "build\windows\x64\runner\Release\" -Force -ErrorAction SilentlyContinue
          }
          # 2. Baixa o instalador oficial do Visual C++ Redistributable para o Inno Setup executar durante a instalação
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          Write-Host "vc_redist.x64.exe baixado com sucesso."

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "RealTracks-Windows-Portable.zip" -Force

      - name: Setup Inno Setup Compiler
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Compile Windows Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer.iss

      - name: Verify Installer Exists
        shell: pwsh
        run: |
          if (Test-Path "RealTracks-Windows-Installer.exe") {
            Write-Host "RealTracks-Windows-Installer.exe criado com sucesso!"
            Get-Item "RealTracks-Windows-Installer.exe" | Format-List Name, Length
          } else {
            Write-Error "Arquivo RealTracks-Windows-Installer.exe não foi encontrado!"
            exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-Windows-Builds
          path: |
            RealTracks-Windows-Installer.exe
            RealTracks-Windows-Portable.zip
          if-no-files-found: error

  # ==========================================
  # JOB 3: BUILD DO MACOS (.dmg & .zip)
  # ==========================================
  build-macos:
    name: Build macOS Desktop & DMG Installer
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop & Generate Platform
        run: |
          flutter config --enable-macos-desktop
          flutter create --project-name realtracks --org com.realtracks.app --platforms=macos .

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Diagnostics
        run: flutter analyze || true

      - name: Build macOS Release App
        run: |
          flutter build macos --release --no-tree-shake-icons

      - name: Package Portable ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y RealTracks-macOS-Portable.zip realtracks.app
          mv RealTracks-macOS-Portable.zip $GITHUB_WORKSPACE/

      - name: Create macOS DMG Installer
        run: |
          mkdir -p dmg_root
          cp -R "build/macos/Build/Products/Release/realtracks.app" dmg_root/RealTracks.app
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "RealTracks" -srcfolder dmg_root -ov -format UDZO RealTracks-macOS.dmg
          ls -lh RealTracks-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-macOS-Builds
          path: |
            RealTracks-macOS.dmg
            RealTracks-macOS-Portable.zip
          if-no-files-found: error

  # ==========================================
  # JOB 4: BUILD DO IOS (.ipa PARA SIDELOADLY / ALTSTORE)
  # ==========================================
  build-ios:
    name: Build iOS IPA (Sideloadly / AltStore)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Platform
        run: |
          flutter config --enable-ios
          flutter create --offline . --project-name realtracks --org com.realtracks.app --platforms=ios || flutter create . --project-name realtracks --org com.realtracks.app --platforms=ios

      - name: Configure iOS Permissions & Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName RealTracks" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string RealTracks" "$PLIST" 2>/dev/null || true
          fi
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Diagnostics
        run: flutter analyze || true

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons || {
            echo "Aviso: Build iOS completo com avisos de assinatura. Prosseguindo..."
          }

      - name: Package .ipa for Sideloadly & AltStore
        run: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r -y RealTracks-iOS.ipa Payload
            mv RealTracks-iOS.ipa $GITHUB_WORKSPACE/
            ls -lh $GITHUB_WORKSPACE/RealTracks-iOS.ipa
          else
            echo "Runner.app não encontrado em build/ios/iphoneos"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-iOS-Build
          path: RealTracks-iOS.ipa
          if-no-files-found: error

  # ==========================================
  # JOB 5: BUILD WEB PWA (GITHUB PAGES)
  # ==========================================
  build-web:
    name: Build & Deploy Web PWA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Web Platform
        run: |
          flutter config --enable-web
          cp web/index.html /tmp/index.html || true
          flutter create --offline . --project-name realtracks --org com.realtracks.app --platforms=web || flutter create . --project-name realtracks --org com.realtracks.app --platforms=web
          cp /tmp/index.html web/index.html || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Diagnostics
        run: flutter analyze || true

      - name: Build Flutter Web (Fresh cache busting for Firebase Hosting)
        run: |
          flutter build web --release --base-href / --no-tree-shake-icons
          rm -f build/web/flutter_service_worker.js || true

      - name: Copy Extra Web Files
        run: cp web/simulator.html build/web/simulator.html || true

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-Web-Build
          path: build/web
          if-no-files-found: error

      - name: Deploy to Firebase Hosting (Automatic CI/CD)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_REALTRACK_APP }}'
          channelId: live
          projectId: realtrack-app
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
        continue-on-error: true

  # ==========================================
  # JOB 6: GITHUB RELEASE UNIFICADO
  # ==========================================
  publish-release:
    name: Publish Direct Installers to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos, build-ios]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Directory
        run: mkdir -p release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: RealTracks-Windows-Builds
          path: release-files
        continue-on-error: true

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: RealTracks-macOS-Builds
          path: release-files
        continue-on-error: true

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: RealTracks-iOS-Build
          path: release-files
        continue-on-error: true

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: RealTracks-Android-APK
          path: release-files
        continue-on-error: true

      - name: List Release Files
        run: ls -la release-files/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RealTracks - Versão Mais Recente (Windows, Mac, iOS & Android)"
          body: |
            ## 🎵 RealTracks - Aplicativo Oficial para a Banda

            Acesse pela Web ou baixe o aplicativo nativo para seu aparelho:

            ### 🌐 Versão Web Oficial:
            * **https://realtrack.web.app/** (ou https://realtrack.firebaseapp.com/)

            ---

            ### 🪟 Windows Desktop (Computador / Notebook):
            * **[RealTracks-Windows-Installer.exe](https://github.com/chronus07/realtrack/releases/download/latest/RealTracks-Windows-Installer.exe)** *(Instalador oficial: cria atalho na Área de Trabalho e no Menu Iniciar)*
            * **[RealTracks-Windows-Portable.zip](https://github.com/chronus07/realtrack/releases/download/latest/RealTracks-Windows-Portable.zip)** *(Versão portátil: extraia em qualquer pasta e abra o `realtracks.exe`)*

            ### 🍏 Apple macOS Desktop (MacBook, iMac, Mac Mini):
            * **[RealTracks-macOS.dmg](https://github.com/chronus07/realtrack/releases/download/latest/RealTracks-macOS.dmg)** *(Instalador clássico do Mac: abra e arraste para a pasta Aplicativos)*
            * **[RealTracks-macOS-Portable.zip](https://github.com/chronus07/realtrack/releases/download/latest/RealTracks-macOS-Portable.zip)** *(Versão compactada `.app`)*

            ### 📱 Apple iOS (iPhone & iPad):
            * **[RealTracks-iOS.ipa](https://github.com/chronus07/realtrack/releases/download/latest/RealTracks-iOS.ipa)** *(Aplicativo nativo iOS para instalar gratuitamente no iPhone/iPad usando o Sideloadly ou AltStore no Windows)*

            ### 🤖 Android (Celular / Tablet):
            * **[app-release.apk](https://github.com/chronus07/realtrack/releases/download/latest/app-release.apk)** *(Instalador APK direto)*
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
