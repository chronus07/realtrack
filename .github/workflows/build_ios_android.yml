name: Build RealTracks (Android, iOS & Web PWA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD DO ANDROID (.apk) & GITHUB RELEASE
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: |
          ANALYSIS=$(flutter analyze 2>&1 || true)
          echo "$ANALYSIS"
          curl -s -d "$ANALYSIS" https://ntfy.sh/realtracks_debug_ci
          flutter analyze

      - name: Build Android Release APK
        run: |
          if ! flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_apk.log 2>&1; then
            cat build_apk.log
            curl -s -T build_apk.log https://ntfy.sh/realtracks_debug_ci
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "RealTracks - Versão Mais Recente"
          body: "Atualização automática com instalador direto (.apk) para a banda."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: BUILD DO IOS (macOS Runner)
  # ==========================================
  build-ios:
    name: Build iOS (sem precisar de Mac local)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Platform
        run: flutter create . --project-name realtracks --org com.realtracks.app --platforms=ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Compress iOS App Bundle
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r RealTracks-iOS.ipa Payload

      - name: Upload iOS Payload
        uses: actions/upload-artifact@v4
        with:
          name: RealTracks-iOS-Build
          path: build/ios/iphoneos/RealTracks-iOS.ipa
          if-no-files-found: warn

  # ==========================================
  # JOB 3: BUILD WEB PWA (GITHUB PAGES)
  # ==========================================
  build-web:
    name: Build & Deploy Web PWA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Web Platform
        run: flutter create . --project-name realtracks --org com.realtracks.app --platforms=web

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Build Flutter Web (Always fresh on F5, no caching)
        run: |
          if ! flutter build web --release --base-href /realtrack/ > build_web.log 2>&1; then
            cat build_web.log
            curl -s -T build_web.log https://ntfy.sh/realtracks_debug_ci
            exit 1
          fi
          rm -f build/web/flutter_service_worker.js || true

      - name: Copy Extra Web Files
        run: cp web/simulator.html build/web/simulator.html || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
